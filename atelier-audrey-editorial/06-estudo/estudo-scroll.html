<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier Audrey / Estudo</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e7;color:#272722;font:16px system-ui}header{padding:24px}h1{font:40px Georgia;margin:0}#stage{position:relative;overflow:hidden;height:65vh;min-height:320px}#stage img{position:absolute;width:100%;height:100%;object-fit:cover}.portrait{opacity:0}.meche{opacity:0;object-fit:contain!important}#title{position:absolute;left:8%;bottom:10%;color:white;font:clamp(60px,12vw,160px) Georgia;margin:0;text-shadow:0 1px 12px #272722}footer{padding:24px}input{width:100%;accent-color:#777d60}.cards{display:flex;gap:20px;padding:24px}.cards img{width:calc(33.33% - 14px);object-fit:cover;aspect-ratio:1}a{color:inherit}@media(max-width:600px){.cards{flex-direction:column}.cards img{width:100%}}</style><header><h1>Le mouvement vous révèle</h1><p>Estudo de ritmo reconstruído. Arraste o progresso para explorar macro, retrato e entrega aos painéis.</p></header><div id="stage"><img class="macro" src="../02-hero/03-macro-hair.png" alt="Macro dos cabelos"><img class="portrait" src="../02-hero/02-hero-portrait.png" alt="Retrato editorial"><img class="meche" src="../03-camadas/07-meche-alpha.png" alt=""><p id="title">audrey</p></div><footer><label for="progress">Progresso <output id="value">0%</output></label><input id="progress" type="range" min="0" max="100" value="0"><p id="phase">Macro</p><a href="../catalogo.html">Voltar ao catálogo</a></footer><div class="cards"><img src="../04-secoes/04-couleur-bronde.png" alt="Cor"><img src="../04-secoes/05-coupe-homme.png" alt="Corte masculino"><img src="../04-secoes/06-geste-atelier.png" alt="Gesto de atendimento"></div><script>const q=s=>document.querySelector(s),clamp=x=>Math.max(0,Math.min(1,x));function draw(){const p=q('#progress').value/100,reveal=clamp((p-.18)/.24);q('.portrait').style.opacity=reveal;q('.portrait').style.clipPath=`inset(0 ${(1-reveal)*45}% round 2px)`;q('.macro').style.opacity=1-reveal;q('.macro').style.transform=`scale(${1.12-.08*p})`;q('.meche').style.opacity=Math.sin(clamp((p-.42)/.4)*Math.PI)*.65;q('.meche').style.transform=`translateX(${12-22*p}%) rotate(${-4+6*p}deg)`;q('#title').style.opacity=reveal;q('#value').value=Math.round(p*100)+'%';q('#phase').textContent=p<.18?'Macro':p<.42?'Retrato revelado':p<.65?'Curva em movimento':p<.88?'Abertura dos painéis':'Entrega às especialidades'}q('#progress').addEventListener('input',draw);if(matchMedia('(prefers-reduced-motion: reduce)').matches)q('#progress').value=100;draw();</script></html>
